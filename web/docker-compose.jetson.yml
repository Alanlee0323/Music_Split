services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.jetson
      args:
        # Override this if your Xavier NX image tag differs.
        BASE_IMAGE: ${JETSON_PYTORCH_IMAGE:-nvcr.io/nvidia/l4t-pytorch:r35.6.0-pth2.1-py3}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      DATA_DIR: /app/data
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    runtime: nvidia
    restart: unless-stopped
